<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>매일 할 일</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="할일">
<style>
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;background:#f5f3ff;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;-webkit-tap-highlight-color:transparent;}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:20px 16px 120px;box-sizing:border-box;}
.card{background:white;border-radius:24px;padding:20px;box-shadow:0 10px 30px -18px rgba(0,0,0,.2);border:1px solid #e2e8f0;margin-bottom:16px;}
.header h1{font-size:32px;margin:0 0 6px;letter-spacing:-1px;}
.muted{color:#64748b;font-size:13px;}
.progress{display:flex;gap:16px;align-items:center;}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(#111827 var(--pct),#f1f5f9 0);display:grid;place-items:center;flex-shrink:0;}
.ring span{background:white;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;}
.stats{display:flex;gap:8px;flex:1;}
.stat{flex:1;background:#f8fafc;border-radius:16px;padding:12px;text-align:center;}
.stat b{display:block;font-size:20px;margin-top:4px;}
.input-row{display:flex;gap:10px;}
.input-row input{flex:1;border:2px solid #e2e8f0;border-radius:14px;padding:14px 14px;font-size:16px;outline:none;background:white;-webkit-appearance:none;}
.input-row input:focus{border-color:#111827;}
.btn{background:#111827;color:white;border:0;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer;font-size:15px;min-height:50px;min-width:64px;}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.cat{border:1.5px solid #e2e8f0;padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;background:white;user-select:none;}
.cat.on{background:#111827;color:white;border-color:#111827;}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 14px;border:1.5px solid #e2e8f0;border-radius:16px;margin-bottom:10px;background:white;}
.task.done{opacity:.55;background:#f8fafc;}
.check{width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;cursor:pointer;flex-shrink:0;background:white;font-size:14px;}
.check.on{background:#111827;border-color:#111827;color:white;}
.task-text{flex:1;font-size:15px;line-height:1.5;word-break:break-word;}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;background:#f1f5f9;display:inline-block;margin-top:6px;color:#475569;}
.del{cursor:pointer;color:#94a3b8;padding:4px 8px;font-size:18px;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header" style="padding:10px 4px 16px;">
    <h1>매일 할 일</h1>
    <div class="muted" id="dateStr"></div>
    <div class="muted" style="margin-top:4px;">집중하는 하루가 되길 바라요</div>
  </div>

  <div class="card">
    <div class="progress">
      <div class="ring" id="ring" style="--pct:0%"><span id="pctTxt">0%</span></div>
      <div class="stats">
        <div class="stat"><span class="muted">오늘</span><b id="total">0</b></div>
        <div class="stat"><span class="muted">완료</span><b id="done">0</b></div>
        <div class="stat"><span class="muted">남은</span><b id="left">0</b></div>
      </div>
    </div>
  </div>

  <div class="card">
    <form id="todoForm" class="input-row" onsubmit="return false;">
      <input id="taskInput" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" placeholder="할 일을 입력하세요..." />
      <button class="btn" id="addBtn" type="submit">추가</button>
    </form>
    <div class="cats" id="cats"></div>
  </div>

  <div id="list"></div>

  <div class="card" style="text-align:center;">
    <button id="archiveBtn" style="border:1.5px solid #e2e8f0;background:white;padding:12px 18px;border-radius:12px;cursor:pointer;font-size:13px;width:100%;font-weight:600;">✅ 완료한 일 보관하기</button>
    <div style="margin-top:12px;font-size:11px;color:#94a3b8;">더블클릭: 수정 / 길게 누르기: 삭제</div>
  </div>
</div>

<script>
(function(){
  const CATS = ["업무","개인","공부","건강","기타"];
  let selCat = "개인";
  let tasks = [];
  try {
    tasks = JSON.parse(localStorage.getItem('daily-todo-v3') || '[]');
  } catch(e){ tasks = []; }

  const dateEl = document.getElementById('dateStr');
  dateEl.textContent = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());

  const catsEl = document.getElementById('cats');
  function renderCats(){
    catsEl.innerHTML = '';
    CATS.forEach(c=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat' + (selCat===c?' on':'');
      b.textContent = c;
      b.addEventListener('click', ()=>{ selCat=c; renderCats(); });
      catsEl.appendChild(b);
    });
  }

  function save(){
    try{ localStorage.setItem('daily-todo-v3', JSON.stringify(tasks)); } catch(e){ console.log(e); }
  }

  function render(){
    const total = tasks.length;
    const done = tasks.filter(t=>t.done).length;
    const left = total - done;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('total').textContent = total;
    document.getElementById('done').textContent = done;
    document.getElementById('left').textContent = left;
    document.getElementById('pctTxt').textContent = pct + '%';
    document.getElementById('ring').style.setProperty('--pct', pct + '%');

    const list = document.getElementById('list');
    list.innerHTML = '';
    tasks.forEach(t=>{
      const div = document.createElement('div');
      div.className = 'task' + (t.done?' done':'');
      const safeText = (t.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      div.innerHTML = '<div class="check ' + (t.done?'on':'') + '">' + (t.done?'✓':'') + '</div>' +
        '<div class="task-text"><div style="' + (t.done?'text-decoration:line-through;color:#94a3b8;':'') + '">' + safeText + '</div><span class="badge">' + t.cat + '</span></div>' +
        '<div class="del">✕</div>';
      
      div.querySelector('.check').addEventListener('click', ()=>{
        t.done = !t.done;
        save(); render();
      });
      div.querySelector('.del').addEventListener('click', ()=>{
        if(confirm('삭제할까요?')){ tasks = tasks.filter(x=>x.id!==t.id); save(); render(); }
      });
      div.addEventListener('dblclick', ()=>{
        const nt = prompt('수정할 내용', t.text);
        if(nt && nt.trim()){ t.text = nt.trim(); save(); render(); }
      });
      list.appendChild(div);
    });
  }

  function addTask(){
    const inp = document.getElementById('taskInput');
    const v = (inp.value||'').trim();
    if(!v){
      inp.focus();
      return;
    }
    tasks.unshift({id:Date.now().toString(), text:v, cat:selCat, done:false});
    inp.value = '';
    save();
    render();
    // 모바일에서 키보드 유지하면서 포커스 다시
    setTimeout(()=>{ inp.focus(); }, 100);
  }

  // 이벤트 바인딩 - 가장 확실한 방법
  document.getElementById('todoForm').addEventListener('submit', function(e){
    e.preventDefault();
    addTask();
  });
  document.getElementById('addBtn').addEventListener('click', function(e){
    e.preventDefault();
    addTask();
  });

  document.getElementById('archiveBtn').addEventListener('click', ()=>{
    if(!confirm('완료된 일을 보관(삭제)할까요?')) return;
    tasks = tasks.filter(t=>!t.done);
    save(); render();
  });

  // 초기 렌더
  renderCats();
  render();

  // PWA manifest
  const iconSvg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='140' fill='#111827'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-size='300' fill='white' font-weight='800'>✓</text></svg>";
  const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(iconSvg);
  const manifest = {
    name:'매일 할 일',
    short_name:'할일',
    description:'매일 확인하는 투두리스트',
    display:'standalone',
    background_color:'#f5f3ff',
    theme_color:'#111827',
    start_url:'./todo.html',
    scope:'./',
    icons:[{src:iconUrl,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]
  };
  const blob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const mUrl = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = mUrl;
  document.head.appendChild(link);
})();
</script>
</body>
</html>
